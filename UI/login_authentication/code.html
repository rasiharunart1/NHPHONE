<body class="flex items-center justify-center min-h-screen">
<!-- Atmospheric Background Elements -->
<div class="bg-glow -top-48 -left-48"></div>
<div class="bg-glow -bottom-48 -right-48" style="background: radial-gradient(circle, rgba(233, 179, 255, 0.05) 0%, rgba(233, 179, 255, 0) 70%);"></div>
<!-- Main Auth Canvas -->
<main class="w-full max-w-md px-6">
<!-- Brand Identity -->
<div class="text-center mb-12">
<h1 class="text-4xl font-black tracking-tighter text-primary-fixed mb-2">NH PHONE</h1>
<p class="text-on-surface-variant font-medium tracking-wide text-sm uppercase">Atmospheric Luxury</p>
</div>
<!-- Login Card -->
<div class="glass-card rounded-xl p-8 shadow-2xl relative overflow-hidden">
<!-- Decorative Accent -->
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-secondary/20 to-transparent"></div>
<header class="mb-10 text-center">
<h2 class="text-2xl font-semibold text-on-surface tracking-tight mb-2">Welcome Back</h2>
<p class="text-on-surface-variant text-sm">Access your premium ecosystem</p>
</header>
<form class="space-y-6">
<!-- Email Input -->
<div class="space-y-2">
<label class="block text-xs font-bold text-on-surface-variant uppercase tracking-widest ml-1">Email Address</label>
<div class="relative group input-focus-glow rounded-lg transition-all duration-300">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-lg">mail</span>
<input class="w-full bg-surface-container-highest/30 border-none rounded-lg py-4 pl-12 pr-4 text-on-surface placeholder:text-outline/50 focus:ring-1 focus:ring-secondary/30 transition-all outline-none" placeholder="name@example.com" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-2">
<div class="flex justify-between items-center ml-1">
<label class="block text-xs font-bold text-on-surface-variant uppercase tracking-widest">Password</label>
<a class="text-[10px] font-bold text-secondary uppercase tracking-widest hover:text-on-secondary-container transition-colors" href="#">Forgot?</a>
</div>
<div class="relative group input-focus-glow rounded-lg transition-all duration-300">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-lg">lock</span>
<input class="w-full bg-surface-container-highest/30 border-none rounded-lg py-4 pl-12 pr-4 text-on-surface placeholder:text-outline/50 focus:ring-1 focus:ring-secondary/30 transition-all outline-none" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Primary Login Action -->
<div class="pt-4">
<button class="w-full py-4 bg-primary text-on-primary font-bold rounded-lg shadow-lg shadow-primary/10 hover:scale-[1.02] active:scale-95 transition-all duration-300 flex items-center justify-center gap-2" type="submit">
                        Login
                        <span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</div>
</form>
<!-- Divider -->
<div class="relative my-10">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/30"></div>
</div>
<div class="relative flex justify-center text-xs uppercase tracking-[0.2em]">
<span class="bg-surface-container-low px-4 text-outline">Or continue with</span>
</div>
</div>
<!-- Social Auth -->
<div class="space-y-4">
<button class="w-full py-4 bg-white/5 border border-white/10 text-on-surface font-medium rounded-lg hover:bg-white/10 hover:scale-[1.01] active:scale-95 transition-all duration-300 flex items-center justify-center gap-3">
<img alt="Google Logo" class="w-5 h-5 opacity-80" data-alt="clean minimal google brand icon with soft colors and subtle drop shadow" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBI4vP33JJClCsnUfG2WIqNwjQ17pGyzb7WF9w7cgH3ofLxMtStiwLb5c4sMrs-yWLmzUhuA5MxyGfHD0IKOh67FyvGy6I1nAqbT1HCoHOqUWRsHIFf8m564gJqdDwFxn5al_Tdu4PEuqlRVr06P0t2TcLYFTFFFQQOB5w1jGBGzELG9FM0DwAWp6zn4iQBBFGoyX84YJhe82G3eHUvoApiy_m0EMFamCgjJ-pF2jKqdQszA_hIR0fTAKOXziT-mufhWsQnnuRC2iU"/>

<p class="text-on-surface-variant text-sm font-medium">
                Don't have an account? 
                <a class="text-secondary hover:underline underline-offset-4 ml-1" href="#">Create Access</a>
</p>

<a class="text-[10px] font-bold text-outline-variant uppercase tracking-[0.2em] hover:text-on-surface-variant transition-colors" href="#">Privacy</a>
<a class="text-[10px] font-bold text-outline-variant uppercase tracking-[0.2em] hover:text-on-surface-variant transition-colors" href="#">Terms</a>
